version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Pinned to an exact beta that must move in step with @wailsio/runtime;
      # upgrade both together by hand.
      - dependency-name: github.com/wailsapp/wails/v3

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@wailsio/runtime"
    groups:
      fluentui:
        patterns: ["@fluentui/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
