name: 功能建议 / Feature request
description: 提出新功能或改进 / Suggest a new feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / The problem you want solved
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你的想法 / Your idea
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他办法 / Alternatives you've considered
