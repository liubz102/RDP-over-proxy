name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the Wails CLI (same version as go.mod)
        shell: pwsh
        run: |
          $version = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$version"

      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Build
        run: wails3 build

      # After the build, because the main package embeds frontend/dist.
      - name: Go checks
        run: |
          go vet ./...
          go vet -tags server ./...
          go test ./... -count=1

      - uses: actions/upload-artifact@v7
        with:
          name: RDP-over-proxy-${{ github.sha }}
          path: bin/RDP-over-proxy.exe
          if-no-files-found: error
