<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!-- appicon.svg drawn for 40 px: the monitor's edges on whole pixels. -->
  <defs>
    <linearGradient id="tile" x1="10" y1="2" x2="30" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3F7FF"/>
      <stop offset="1" stop-color="#D3E1FA"/>
    </linearGradient>
    <linearGradient id="orbit" x1="4.38" y1="23.25" x2="35.62" y2="12.31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0891B2"/>
      <stop offset=".5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <clipPath id="far"><rect width="40" height="17.31"/></clipPath>
    <clipPath id="near"><rect y="17.31" width="40" height="22.69"/></clipPath>
  </defs>

  <!-- Tile -->
  <rect x="2" y="2" width="36" height="36" rx="8" fill="url(#tile)"/>
  <rect x="2.5" y="2.5" width="35" height="35" rx="7.5" fill="none" stroke="#0F172A" stroke-opacity=".14"/>

  <!-- Far half of the orbit -->
  <g transform="rotate(-18 20 17.31)">
    <ellipse cx="20" cy="17.31" rx="15.62" ry="4.69" fill="none" stroke="url(#orbit)" stroke-width="1.6" stroke-opacity=".5" clip-path="url(#far)"/>
  </g>

  <!-- Monitor -->
  <rect x="9" y="9" width="22" height="16" rx="3.5" fill="#1F2A5C"/>
  <rect x="11" y="11" width="18" height="12" rx="1.5" fill="#FFFFFF"/>
  <rect x="19" y="25" width="2" height="2" fill="#1F2A5C"/>
  <rect x="15" y="27" width="10" height="2" rx="1" fill="#1F2A5C"/>

  <!-- Near half of the orbit and the relay -->
  <g transform="rotate(-18 20 17.31)">
    <ellipse cx="20" cy="17.31" rx="15.62" ry="4.69" fill="none" stroke="url(#orbit)" stroke-width="1.6" clip-path="url(#near)"/>
    <circle cx="34.04" cy="19.37" r="2.5" fill="#FFFFFF"/>
    <circle cx="34.04" cy="19.37" r="1.8" fill="#7C3AED"/>
  </g>
</svg>
