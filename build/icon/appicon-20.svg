<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <!-- appicon.svg drawn for 20 px: the monitor's edges on whole pixels. -->
  <defs>
    <linearGradient id="tile" x1="5" y1="1" x2="15" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3F7FF"/>
      <stop offset="1" stop-color="#D3E1FA"/>
    </linearGradient>
    <linearGradient id="orbit" x1="2.19" y1="11.62" x2="17.81" y2="6.16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0891B2"/>
      <stop offset=".5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <clipPath id="far"><rect width="20" height="8.66"/></clipPath>
    <clipPath id="near"><rect y="8.66" width="20" height="11.34"/></clipPath>
  </defs>

  <!-- Tile -->
  <rect x="1" y="1" width="18" height="18" rx="4" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="17" height="17" rx="3.5" fill="none" stroke="#0F172A" stroke-opacity=".14"/>

  <!-- Far half of the orbit -->
  <g transform="rotate(-18 10 8.66)">
    <ellipse cx="10" cy="8.66" rx="7.81" ry="2.34" fill="none" stroke="url(#orbit)" stroke-width="1" stroke-opacity=".5" clip-path="url(#far)"/>
  </g>

  <!-- Monitor -->
  <rect x="5" y="5" width="10" height="7" rx="1.75" fill="#1F2A5C"/>
  <rect x="6" y="6" width="8" height="5" rx="0.75" fill="#FFFFFF"/>
  <rect x="9" y="12" width="2" height="2" fill="#1F2A5C"/>
  <rect x="7" y="14" width="6" height="1" rx="0.5" fill="#1F2A5C"/>

  <!-- Near half of the orbit and the relay -->
  <g transform="rotate(-18 10 8.66)">
    <ellipse cx="10" cy="8.66" rx="7.81" ry="2.34" fill="none" stroke="url(#orbit)" stroke-width="1" clip-path="url(#near)"/>
    <circle cx="16.63" cy="9.9" r="1.6" fill="#FFFFFF"/>
    <circle cx="16.63" cy="9.9" r="1.1" fill="#7C3AED"/>
  </g>
</svg>
