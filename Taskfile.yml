version: '3'

# RDP-over-proxy is Windows-only (it drives mstsc.exe, Credential Manager and DPAPI),
# so only the common and windows task files from the Wails template are kept.

vars:
  APP_NAME: "RDP-over-proxy"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  GOOS: windows

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: windows:build

  # One command for a release: wails3 task release [TAG=v1.2.3]. The GitHub
  # release workflow runs it too, so a local zip and a published one are made
  # the same way.
  release:
    summary: Checks, tests and builds a release into release/<version>/ (the zip, the notices, SHA256SUMS.txt)
    desc: |
      wails3 task release              named by the version the files carry
      wails3 task release TAG=v1.2.3   checks the tag against the files first and names the release by it
      The program is built into release/<version>/build, never into bin/, where
      the copy in daily use may be running. Nothing here changes a version.
    vars:
      VERSION:
        sh: go run tools/release/main.go -print-version{{if .TAG}} -tag {{.TAG}}{{end}}
      OUT: release/{{.VERSION}}
    cmds:
      - go run tools/release/main.go
      - npm --prefix frontend ci
      - npm --prefix frontend run typecheck
      - npm --prefix frontend test
      - wails3 task build BIN_DIR={{.OUT}}/build VERSION={{.VERSION}}
      # After the build, because the main package embeds frontend/dist.
      - go vet ./...
      - go vet -tags server ./...
      - go test ./... -count=1
      - go run tools/release/main.go -pack -version {{.VERSION}} -exe {{.OUT}}/build/RDP-over-proxy.exe -out {{.OUT}}

  run:
    summary: Runs the application
    cmds:
      - task: windows:run

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only) for checking the UI in a browser
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server
